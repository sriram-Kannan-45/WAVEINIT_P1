<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="WAVE INIT - Modern Learning Management System" />
    <title>WAVE INIT LMS</title>
    <style>
      #app-initial-loader.app-initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #64748b;
        font-family: Poppins, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-initial-loader p {
        margin: 14px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .app-initial-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: app-boot-spin 0.8s linear infinite;
      }

      @keyframes app-boot-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root">
      <div id="app-initial-loader" class="app-initial-loader" role="status" aria-live="polite">
        <div class="app-initial-spinner" aria-hidden="true"></div>
        <p>Loading WAVE INIT...</p>
      </div>
    </div>
    <script src="/bootstrap.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
