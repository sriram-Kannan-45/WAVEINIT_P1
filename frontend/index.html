<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="WAVE INIT - Modern Learning Management System" />
    <title>WAVE INIT LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root">
      <div id="app-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #16a34a; border-radius: 50%; animation: appBootSpin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 13px; font-weight: 600; color: #64748b; letter-spacing: 0.2px;">Loading WAVE INIT...</p>
        <style>
          @keyframes appBootSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      (function() {
        // Optional Eruda mobile console support (triggered via ?debug=1 or on mobile startup crash)
        var isDebug = window.location.search.indexOf('debug') !== -1 || window.location.hash.indexOf('debug') !== -1;
        function loadEruda() {
          if (window._erudaLoaded) return;
          window._erudaLoaded = true;
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/eruda';
          s.onload = function() { if (window.eruda) window.eruda.init(); };
          document.head.appendChild(s);
        }
        if (isDebug) loadEruda();

        // Catch startup crashes before React mounts
        function showStartupError(msg, err) {
          var root = document.getElementById('root');
          var loader = document.getElementById('app-initial-loader');
          if (loader && root) {
            loader.innerHTML = '<div style="max-width: 360px; margin: 20px; padding: 22px; background: #ffffff; border: 1px solid #fecaca; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.08);">' +
              '<div style="width: 48px; height: 48px; border-radius: 50%; background: #fee2e2; color: #dc2626; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 22px; font-weight: bold;">!</div>' +
              '<h3 style="color: #0f172a; font-size: 16px; margin: 0 0 6px 0; font-weight: 700;">Unable to Load Application</h3>' +
              '<p style="color: #dc2626; font-size: 12px; margin: 0 0 16px 0; line-height: 1.4; word-break: break-word; background: #fef2f2; padding: 8px 10px; border-radius: 8px;">' + (msg || 'Unknown startup error') + '</p>' +
              '<button onclick="window.location.reload()" style="width: 100%; padding: 11px; background: #16a34a; color: #ffffff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">Reload Application</button>' +
            '</div>';
          }
        }

        window.addEventListener('error', function(e) {
          console.error('[Global Error]', e);
          if (document.getElementById('app-initial-loader')) {
            showStartupError(e.message || 'Script execution error', e.error);
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          console.error('[Unhandled Rejection]', e.reason);
          if (document.getElementById('app-initial-loader')) {
            showStartupError(e.reason ? (e.reason.message || String(e.reason)) : 'Async promise error');
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
