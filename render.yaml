services:
  # ── 1. Backend Web Service (Node.js + Express + Socket.IO) ──
  - type: web
    name: waveinit-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/app.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Must match backend tokenService: ACCESS_TOKEN_EXPIRY / ACCESS_TOKEN_EXPIRY_MINUTES
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: ACCESS_TOKEN_EXPIRY_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRY_DAYS
        value: 7
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      # Persisted secrets: do NOT use generateValue (it rotates on redeploy and kills sessions).
      # Set these once in the Render dashboard.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STREAMING_TICKET_SECRET
        sync: false
      - key: AI_SERVICE_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: FRONTEND_URL
        fromService:
          type: web
          name: waveinit-frontend
          property: host

  # ── 2. Frontend Static Site (React + Vite SPA) ──
  - type: web
    name: waveinit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: waveinit-backend
          property: host
      - key: VITE_PUBLIC_URL
        fromService:
          type: web
          name: waveinit-frontend
          property: host
