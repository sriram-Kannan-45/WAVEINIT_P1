# ==============================================================================
# WAVE INIT LMS — ONE MANAGED LOAD BALANCER CONFIGURATION
# ==============================================================================

# WebSocket Upgrade Connection Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate Limiting Zones (Token Bucket)
limit_req_zone $binary_remote_addr zone=lms_api_limit:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=lms_auth_limit:10m rate=10r/s;

# ------------------------------------------------------------------------------
# UPSTREAM PARTICIPANT APPLICATION SERVERS (AUTO-SCALING POOL)
# ------------------------------------------------------------------------------
upstream lms_backend {
    least_conn; # Distribute traffic to the server with fewest active connections

    # Primary Participant Application Servers (Minimum 2 Instances)
    server app-server-1:3001 max_fails=3 fail_timeout=10s;
    server app-server-2:3001 max_fails=3 fail_timeout=10s;

    # Dynamic scaling instances (Optional / Auto-Scaled)
    # server app-server-3:3001 max_fails=3 fail_timeout=10s;
    # server app-server-4:3001 max_fails=3 fail_timeout=10s;

    keepalive 64; # Keep connections alive to backend to eliminate TCP handshake latency
}

# ------------------------------------------------------------------------------
# LOAD BALANCER HTTP SERVER (PORT 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. LOAD BALANCER HEALTH CHECK (Sub-millisecond probe endpoint)
    # --------------------------------------------------------------------------
    location /lb-health {
        access_log off;
        return 200 '{"status":"ok","balancer":"lms-load-balancer","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # --------------------------------------------------------------------------
    # 2. APPLICATION SERVER HEALTH PROBE (Proxies to Backend /health)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://lms_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. WEBSOCKET / SOCKET.IO REAL-TIME TRAFFIC (Interviews, Proctoring, Alerts)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://lms_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeout (Keep connection alive for long interviews & tests)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # --------------------------------------------------------------------------
    # 4. AUTHENTICATION APIs (Rate-Limited to Prevent Brute Force)
    # --------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=lms_auth_limit burst=20 nodelay;

        proxy_pass http://lms_backend/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # --------------------------------------------------------------------------
    # 5. GENERAL PARTICIPANT APIs (Quizzes, Coding, Interviews, Auto-Save, Dashboard)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=lms_api_limit burst=100 nodelay;

        proxy_pass http://lms_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Failover configuration: if one App Server fails, immediately retry on another
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 6. STATIC UPLOADS & RECORDINGS
    # --------------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://lms_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 7. FRONTEND APPLICATION / DEFAULT FALLBACK
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://lms_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
