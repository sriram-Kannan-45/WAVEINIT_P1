version: '3.8'

services:
  # ============================================================================
  # 1. ONE MANAGED LOAD BALANCER (Nginx Entry Point)
  # ============================================================================
  lms-load-balancer:
    image: nginx:alpine
    container_name: lms-load-balancer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - shared-storage:/app/storage:ro
    depends_on:
      - app-server-1
      - app-server-2
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - lms-network

  # ============================================================================
  # 2. PARTICIPANT APP SERVER 1 (Primary Stateless API Server)
  # ============================================================================
  app-server-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-server-1
    environment:
      - PORT=3001
      - INSTANCE_ID=app-server-1
      - NODE_ENV=production
      - RUN_EMBEDDED_WORKERS=false
      - REDIS_URL=redis://lms-redis:6379
      - SHARED_STORAGE_PATH=/app/storage
    volumes:
      - shared-storage:/app/storage
    depends_on:
      - lms-redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - lms-network

  # ============================================================================
  # 3. PARTICIPANT APP SERVER 2 (Secondary Stateless API Server)
  # ============================================================================
  app-server-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-server-2
    environment:
      - PORT=3001
      - INSTANCE_ID=app-server-2
      - NODE_ENV=production
      - RUN_EMBEDDED_WORKERS=false
      - REDIS_URL=redis://lms-redis:6379
      - SHARED_STORAGE_PATH=/app/storage
    volumes:
      - shared-storage:/app/storage
    depends_on:
      - lms-redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - lms-network

  # ============================================================================
  # 4. SHARED REDIS (Cache, Sessions, Distributed Locks, Socket Adapter, Queues)
  # ============================================================================
  lms-redis:
    image: redis:7-alpine
    container_name: lms-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - lms-network

  # ============================================================================
  # 5. DEDICATED CODE EXECUTION WORKER POOL
  # ============================================================================
  lms-code-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-code-worker-1
    command: ["npm", "run", "worker:code"]
    environment:
      - WORKER_NAME=code-worker-1
      - NODE_ENV=production
      - REDIS_URL=redis://lms-redis:6379
      - SHARED_STORAGE_PATH=/app/storage
    volumes:
      - shared-storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock # For isolated Docker code execution sandbox
    depends_on:
      - lms-redis
    restart: always
    networks:
      - lms-network

  # ============================================================================
  # 6. DEDICATED AI & MEDIAPIPE VIDEO PROCESSING WORKER POOL
  # ============================================================================
  lms-ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-ai-worker-1
    command: ["npm", "run", "worker:ai"]
    environment:
      - WORKER_NAME=ai-worker-1
      - NODE_ENV=production
      - REDIS_URL=redis://lms-redis:6379
      - AI_SERVICE_URL=http://lms-ai-service:8000
      - SHARED_STORAGE_PATH=/app/storage
    volumes:
      - shared-storage:/app/storage
    depends_on:
      - lms-redis
      - lms-ai-service
    restart: always
    networks:
      - lms-network

  # ============================================================================
  # 7. PYTHON FASTAPI AI SERVICE (MediaPipe + YOLO Video Inference)
  # ============================================================================
  lms-ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lms-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always
    networks:
      - lms-network

# ------------------------------------------------------------------------------
# SHARED VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  shared-storage:
    driver: local
  redis-data:
    driver: local

networks:
  lms-network:
    driver: bridge
