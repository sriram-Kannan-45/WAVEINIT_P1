name: Build and deploy AI Python Service to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # BUILD JOB
  # =========================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required packages
        run: |
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import uvicorn; print('Uvicorn OK')"
          python -c "import gunicorn; print('Gunicorn OK')"

      - name: Upload AI service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service
          path: ai-service


  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download AI service artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service
          path: ./ai-service

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5AE7FB17471D40BB84F32E4BB2E07E91 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5187400E023147039278F40A86D7D954 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BB674CF42D547C68E4E439115D4740D }}

      - name: Deploy AI service to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinit-lms-ai'
          slot-name: 'Production'
          package: ./ai-service
