name: Build and Deploy AI Python Service to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service.yml'

  workflow_dispatch:

jobs:

  # ==========================================
  # BUILD AI SERVICE
  # ==========================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify AI service files
        working-directory: ai-service
        run: |
          echo "AI Service files:"
          ls -la
          echo "Python version:"
          python --version
          echo "Requirements file:"
          test -f requirements.txt
          echo "Main file:"
          test -f main.py

      - name: Install Python dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create AI service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service
          path: ai-service
          include-hidden-files: true


  # ==========================================
  # DEPLOY AI SERVICE
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download AI service artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service
          path: .

      - name: Verify deployment files
        run: |
          echo "Deployment root:"
          pwd
          echo "Files:"
          ls -la

          echo "Checking main.py:"
          test -f main.py

          echo "Checking requirements.txt:"
          test -f requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5AE7FB17471D40BB84F32E4BB2E07E91 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5187400E023147039278F40A86D7D954 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BB674CF42D547C68E4E439115D4740D }}

      - name: Deploy AI service to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinit-lms-ai'
          slot-name: 'Production'
          package: .
          startup-command: 'gunicorn -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 main:app --timeout 120'
