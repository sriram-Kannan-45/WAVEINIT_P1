name: Build and deploy Python AI service to Azure Web App - waveinit-lms-ai

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service.yml'
  workflow_dispatch:

jobs:
  # ============================================================================
  # BUILD JOB: Pre-builds dependencies in Linux CI environment
  # ============================================================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install dependencies into antenv & .python_packages
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # 1. Create standard Azure antenv virtual environment
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          
          # 2. Also populate .python_packages for Azure App Service PYTHONPATH fallback
          python -m pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Verify FastAPI and dependencies load cleanly
        working-directory: ai-service
        run: |
          source antenv/bin/activate
          python -c "import uvicorn, gunicorn, fastapi; from main import app; print('✅ FastAPI & Uvicorn worker verified successfully in antenv')"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ai-service
            !ai-service/.env
            !ai-service/venv
            !ai-service/__pycache__

  # ============================================================================
  # DEPLOY JOB: Deploys pre-built package without relying on Oryx remote build
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./app-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5AE7FB17471D40BB84F32E4BB2E07E91 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5187400E023147039278F40A86D7D954 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BB674CF42D547C68E4E439115D4740D }}

      - name: Configure Azure App Settings (Disable remote Oryx build)
        run: |
          az webapp config appsettings set \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_PORT=8000

      - name: Set Startup Command
        run: |
          az webapp config set \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg \
            --startup-file "gunicorn -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 main:app --timeout 120"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinit-lms-ai'
          slot-name: 'Production'
          package: ./app-deploy

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg
