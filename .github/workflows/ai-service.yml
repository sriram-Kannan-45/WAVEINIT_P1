name: Build and deploy Python AI service to Azure Web App - waveinit-lms-ai

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service.yml'
  workflow_dispatch:

jobs:
  # ============================================================================
  # BUILD JOB: Pre-builds dependencies in Linux CI environment
  # ============================================================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install dependencies into antenv
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Create standard Azure antenv virtual environment
          python -m venv antenv
          source antenv/bin/activate
          
          # Force CPU-only PyTorch to prevent downloading 3+ GB of unused NVIDIA CUDA libraries
          pip install --no-cache-dir torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
          
          # Install all other application requirements
          pip install --no-cache-dir -r requirements.txt
          
          # Clean up unnecessary cache and compiled test artifacts to keep package lean
          find antenv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find antenv -type f -name "*.pyc" -delete 2>/dev/null || true
          chmod +x startup.sh

      - name: Verify FastAPI and dependencies load cleanly
        working-directory: ai-service
        run: |
          source antenv/bin/activate
          python -c "import torch, uvicorn, gunicorn, fastapi; print(f'Torch: {torch.__version__} (CUDA available: {torch.cuda.is_available()})'); from main import app; print('✅ FastAPI, Uvicorn & CPU PyTorch verified successfully in antenv')"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ai-service
            !ai-service/.env
            !ai-service/venv
            !ai-service/__pycache__
            !ai-service/**/__pycache__

  # ============================================================================
  # DEPLOY JOB: Deploys pre-built package without relying on Oryx remote build
  # ============================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./app-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5AE7FB17471D40BB84F32E4BB2E07E91 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5187400E023147039278F40A86D7D954 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BB674CF42D547C68E4E439115D4740D }}

      - name: Configure Azure App Settings (Disable remote Oryx build)
        run: |
          az webapp config appsettings set \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_PORT=8000

      - name: Set Startup Command
        run: |
          az webapp config set \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg \
            --startup-file "bash /home/site/wwwroot/startup.sh"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinit-lms-ai'
          slot-name: 'Production'
          package: ./app-deploy

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg
