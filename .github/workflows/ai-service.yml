name: Build and Deploy AI Python Service to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service.yml'

  workflow_dispatch:

jobs:

  # ==========================================
  # BUILD JOB
  # ==========================================
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI application
        working-directory: ai-service
        run: |
          python -c "from main import app; print('FastAPI app loaded successfully')"

      - name: Upload AI service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service
          path: ai-service


  # ==========================================
  # DEPLOY JOB
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download AI service artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5AE7FB17471D40BB84F32E4BB2E07E91 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5187400E023147039278F40A86D7D954 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8BB674CF42D547C68E4E439115D4740D }}

      - name: Verify Azure Web App exists
        run: |
          az webapp show \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg

      - name: Configure Azure App Settings
        run: |
          az webapp config appsettings set \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              WEBSITES_PORT=8000

      - name: Set Startup Command
        run: |
          az webapp config set \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg \
            --startup-file "gunicorn -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 main:app --timeout 120"

      - name: Deploy AI service to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinit-lms-ai'
          slot-name: 'Production'
          package: .

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name waveinit-lms-ai \
            --resource-group lms-backend-rg
