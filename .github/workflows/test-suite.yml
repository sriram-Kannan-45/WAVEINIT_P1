name: Test Suite (static + Playwright POM)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'ai-service/**'
      - 'test/**'
      - '.github/workflows/test-suite.yml'
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Static validation — fast, no services required
  # ─────────────────────────────────────────────────────────────
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend syntax check (all files)
        working-directory: backend
        run: |
          fail=0
          while IFS= read -r file; do
            node --check "$file" || fail=1
          done < <(find src -name '*.js' -not -path '*/node_modules/*')
          if [ "$fail" -ne 0 ]; then
            echo "::error::Backend syntax errors detected"
            exit 1
          fi
          echo "Backend syntax OK"

      - name: Backend security unit tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0000
          JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-use-in-production
          STREAMING_TICKET_SECRET: ci-only-streaming-secret-do-not-use-in-production
        run: |
          node --test test/securityConfig.test.js
          node --test test/gdprRemediation.test.js

      - name: Backend dependency audit (high+)
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend security policy test
        working-directory: frontend
        run: node --test test/securityPolicy.test.mjs

      - name: Frontend production build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

      - name: Frontend dependency audit (high+)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: AI service syntax check
        run: |
          python -m py_compile ai-service/main.py
          find ai-service/inference ai-service/rag ai-service/services -name '*.py' -print0 \
            | xargs -0 -n1 python -m py_compile
          echo "AI service syntax OK"

  # ─────────────────────────────────────────────────────────────
  # 2. Playwright POM end-to-end against localhost services
  # ─────────────────────────────────────────────────────────────
  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-checks
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: training_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      FRONTEND_URL: http://localhost:5174
      BACKEND_URL: http://localhost:3001
      AI_SERVICE_URL: http://localhost:8000
      NODE_ENV: development
      PORT: '3001'
      DB_DIALECT: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: training_db
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-use-in-production
      STREAMING_TICKET_SECRET: ci-only-streaming-secret-do-not-use-in-production
      AI_SERVICE_KEY: ''
      DISABLE_SOCKET_REDIS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Start backend
        working-directory: backend
        run: |
          nohup node src/app.js > backend-ci.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health > /dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"; tail -200 backend-ci.log; exit 1

      - name: Install frontend deps and build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Start frontend preview
        working-directory: frontend
        run: |
          nohup npx vite preview --port 5174 --host 127.0.0.1 > frontend-ci.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5174/ > /dev/null; then
              echo "frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::frontend preview did not start"; tail -100 frontend-ci.log; exit 1

      - name: Install Playwright test deps
        working-directory: test
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Run Playwright POM suite
        working-directory: test
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright-report
            test/test-results
          retention-days: 7