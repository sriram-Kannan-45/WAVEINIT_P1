# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - waveinint

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_waveinint.yml'
  workflow_dispatch:

jobs:
  # =========================
  # BUILD JOB
  # =========================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        working-directory: backend
        run: |
          npm install
          npm run build --if-present
          # tests/trainerSearch.test.js is a data-dependent integration suite
          # (requires a live populated DB + JWT_SECRET) — excluded from the CI
          # gate; run it locally/manually. Remaining suites are unit tests.
          npm run test --if-present -- --testPathIgnorePatterns=tests/trainerSearch.test.js
          npm prune --production

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for requesting OpenID Connect JWT token
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1F237F56D744B5B95EB9D4B517BB809 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_556981C8B5F247E988832183DE303034 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_863B4D16255C43EFB9EC76A74D5FD146 }}

      - name: Ensure AI service URL and SCM stability
        shell: bash
        run: |
          TARGET_URL="https://waveinit-init-a9bfbeh3fgh0f0ca.centralindia-01.azurewebsites.net"
          RG=$(az webapp list --query "[?name=='waveinint'].resourceGroup | [0]" -o tsv 2>/dev/null || true)
          if [ -z "$RG" ] || [ "$RG" = "None" ]; then
            RG="WAVEINIT_BD"
          fi
          echo "Resolved Resource Group: ${RG}"
          CURRENT_VAL=$(az webapp config appsettings list --name waveinint --resource-group "$RG" --query "[?name=='AI_SERVICE_URL'].value | [0]" -o tsv 2>/dev/null || true)
          echo "Current AI_SERVICE_URL in Azure: '$CURRENT_VAL'"
          if [ "$CURRENT_VAL" != "$TARGET_URL" ]; then
            echo "Updating AI_SERVICE_URL to $TARGET_URL in resource group $RG..."
            az webapp config appsettings set --name waveinint --resource-group "$RG" --settings AI_SERVICE_URL="$TARGET_URL" --output none
            echo "Management operation completed. Waiting 30s for SCM container to settle..."
            sleep 30
          else
            echo "AI_SERVICE_URL is already up to date ($CURRENT_VAL). Skipping management update to avoid SCM restart."
            echo "Waiting 15s for SCM container stability..."
            sleep 15
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinint'
          slot-name: 'Production'
          package: .

      - name: Verify backend health
        shell: bash
        run: |
          HEALTH_URL="https://waveinint-ahhsevgvcqaeesh2.centralindia-01.azurewebsites.net/health"
          echo "Verifying backend health at: ${HEALTH_URL}"
          for i in {1..12}; do
            echo "Health probe attempt $i of 12..."
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "${HEALTH_URL}" || echo -e "curl_error\n000")
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
            BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
            echo "HTTP Status: ${HTTP_STATUS}"
            echo "Response Body: ${BODY}"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Backend is live and healthy!"
              break
            fi
            sleep 10
          done