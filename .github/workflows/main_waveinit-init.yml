name: Build and deploy Python AI service to Azure Web App - waveinit-init

on:
  push:
    branches:
      - main
    paths:
      - "ai-service/**"
      - ".github/workflows/main_waveinit-init.yml"

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: waveinit-init
  PYTHON_VERSION: "3.11"
  SERVICE_PATH: ai-service
  DEPLOY_ZIP: ai-service-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate requirements
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify runtime packages
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python - <<'PY'
          import fastapi
          import uvicorn
          import gunicorn

          print("FastAPI OK:", fastapi.__version__)
          print("Uvicorn OK:", uvicorn.__version__)
          print("Gunicorn OK:", gunicorn.__version__)
          PY

      - name: Verify FastAPI application
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python - <<'PY'
          from main import app

          print("FastAPI app import OK")
          print("App:", app)
          PY

      - name: Create Azure deployment package
        run: |
          git archive \
            --format=zip \
            --output="${DEPLOY_ZIP}" \
            HEAD:${SERVICE_PATH}

      - name: Verify deployment package
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          package = "ai-service-source.zip"

          with ZipFile(package) as archive:
              names = set(archive.namelist())

          required = {
              "requirements.txt",
              "main.py",
          }

          missing = required - names

          if missing:
              raise RuntimeError(
                  f"Missing deployment files: {sorted(missing)}"
              )

          forbidden_roots = {
              "antenv",
              ".venv",
              "venv",
              "__pycache__",
          }

          invalid = [
              name for name in names
              if name.split("/")[0] in forbidden_roots
          ]

          if invalid:
              raise RuntimeError(
                  f"Deployment package contains local environment files: {invalid[:10]}"
              )

          print("Deployment package is valid.")
          print(f"Package contains {len(names)} files.")
          PY

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ env.DEPLOY_ZIP }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03AD2C5843F24006BFC1663DE7E2BD7A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2AAFDF1F53BE4ADB850460F3750C2437 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42B805BB56D5497BB27CAAF402A3C099 }}

      - name: Configure Azure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "ENABLE_ORYX_BUILD",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "WEBSITES_PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1",
                "slotSetting": false
              }
            ]

      - name: Remove conflicting package settings
        shell: bash
        run: |
          RESOURCE_GROUP=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)

          if [ -z "$RESOURCE_GROUP" ] || [ "$RESOURCE_GROUP" = "None" ]; then
            echo "Unable to determine resource group."
            exit 1
          fi

          az webapp config appsettings delete \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --setting-names \
              WEBSITE_RUN_FROM_PACKAGE \
              WEBSITE_RUN_FROM_ZIP \
            --output none || true

      - name: Configure FastAPI startup command
        shell: bash
        run: |
          RESOURCE_GROUP=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)

          if [ -z "$RESOURCE_GROUP" ] || [ "$RESOURCE_GROUP" = "None" ]; then
            echo "Unable to determine resource group."
            exit 1
          fi

          az webapp config set \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --startup-file "python -m gunicorn -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 main:app --timeout 120"

      - name: Deploy AI service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./deploy/${{ env.DEPLOY_ZIP }}

      - name: Restart Azure Web App
        shell: bash
        run: |
          RESOURCE_GROUP=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)

          if [ -z "$RESOURCE_GROUP" ] || [ "$RESOURCE_GROUP" = "None" ]; then
            echo "Unable to determine resource group."
            exit 1
          fi

          az webapp restart \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}"

      - name: Show configured startup command
        shell: bash
        run: |
          RESOURCE_GROUP=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)

          az webapp config show \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "appCommandLine" \
            --output tsv
