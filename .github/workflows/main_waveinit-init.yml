name: Build and deploy Python AI service to Azure Web App - waveinit-init

on:
  push:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/main_waveinit-init.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip

      - name: Create Azure-compatible virtual environment
        working-directory: ai-service
        run: |
          python -m venv antenv

      - name: Install Python dependencies
        working-directory: ai-service
        run: |
          antenv/bin/python -m pip install --upgrade pip
          antenv/bin/pip install -r requirements.txt

      - name: Verify required packages
        working-directory: ai-service
        run: |
          antenv/bin/python -c "import fastapi; print('FastAPI OK')"
          antenv/bin/python -c "import uvicorn; print('Uvicorn OK')"
          antenv/bin/python -c "import gunicorn; print('Gunicorn OK')"

      - name: Verify FastAPI application
        working-directory: ai-service
        run: |
          antenv/bin/python -c "from main import app; print('FastAPI app import OK')"

      - name: Package AI service source for Azure build
        run: |
          # Archive the service contents at the ZIP root. CI virtualenvs contain
          # runner-specific paths; Oryx must build the runtime on Azure instead.
          git archive --format=zip --output=ai-service-source.zip HEAD:ai-service

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ai-service-source.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./ai-service-deploy

      - name: Verify deployment files
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('./ai-service-deploy/ai-service-source.zip') as archive:
              names = set(archive.namelist())
              assert {'requirements.txt', 'main.py', 'services/ai_config.py'} <= names, 'AI service files must be at the ZIP root'
              assert not any(name.split('/')[0] in {'antenv', '.venv', 'venv'} for name in names), 'Deploy source, not a CI virtualenv'
          PY

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03AD2C5843F24006BFC1663DE7E2BD7A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2AAFDF1F53BE4ADB850460F3750C2437 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42B805BB56D5497BB27CAAF402A3C099 }}

      - name: Configure Azure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'waveinit-init'
          app-settings-json: |
            [
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "ENABLE_ORYX_BUILD",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "WEBSITES_PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1",
                "slotSetting": false
              }
            ]

      - name: Disable run-from-package for the Python source build
        run: |
          resource_group=$(az webapp list --query "[?name=='waveinit-init'].resourceGroup | [0]" --output tsv)
          test -n "$resource_group" && test "$resource_group" != "None"
          az webapp config appsettings delete --name waveinit-init --resource-group "$resource_group" --setting-names WEBSITE_RUN_FROM_PACKAGE WEBSITE_RUN_FROM_ZIP --output none

      - name: Deploy AI Service to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'waveinit-init'
          slot-name: 'Production'
          package: ./ai-service-deploy/ai-service-source.zip
          startup-command: 'gunicorn -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 main:app --timeout 120'
