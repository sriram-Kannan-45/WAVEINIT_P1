name: Build and deploy Python AI service to Azure Web App - waveinit-init

on:
  push:
    branches:
      - main
    paths:
      - "ai-service/**"
      - ".github/workflows/main_waveinit-init.yml"

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: waveinit-init
  PYTHON_VERSION: "3.11"
  SERVICE_PATH: ai-service
  DEPLOY_ZIP: ai-service-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate requirements
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify runtime packages
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python - <<'PY'
          import fastapi
          import uvicorn
          import gunicorn

          print("FastAPI OK:", fastapi.__version__)
          print("Uvicorn OK:", uvicorn.__version__)
          print("Gunicorn OK:", gunicorn.__version__)
          PY

      - name: Verify FastAPI application
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python - <<'PY'
          from main import app

          print("FastAPI app import OK")
          print("App:", app)
          PY

      - name: Create Azure deployment package
        run: |
          git archive \
            --format=zip \
            --output="${DEPLOY_ZIP}" \
            HEAD:${SERVICE_PATH}

      - name: Verify deployment package
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          package = "ai-service-source.zip"

          with ZipFile(package) as archive:
              names = set(archive.namelist())

          required = {
              "requirements.txt",
              "main.py",
              ".deployment",
          }

          missing = required - names

          if missing:
              raise RuntimeError(
                  f"Missing deployment files: {sorted(missing)}"
              )

          forbidden_roots = {
              "antenv",
              ".venv",
              "venv",
              "__pycache__",
          }

          invalid = [
              name for name in names
              if name.split("/")[0] in forbidden_roots
          ]

          if invalid:
              raise RuntimeError(
                  f"Deployment package contains local environment files: {invalid[:10]}"
              )

          print("Deployment package is valid.")
          print(f"Package contains {len(names)} files.")
          PY

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ env.DEPLOY_ZIP }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03AD2C5843F24006BFC1663DE7E2BD7A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2AAFDF1F53BE4ADB850460F3750C2437 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42B805BB56D5497BB27CAAF402A3C099 }}

      - name: Resolve Resource Group
        id: rg
        shell: bash
        run: |
          RG=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)

          if [ -z "$RG" ] || [ "$RG" = "None" ]; then
            RG="WAVEINIT_BD"
          fi

          echo "RESOURCE_GROUP=${RG}" >> $GITHUB_ENV
          echo "Resolved Resource Group: ${RG}"

      - name: Configure Azure App Settings for Oryx Build
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "ENABLE_ORYX_BUILD",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "ORYX_BUILD_PLATFORM",
                "value": "python",
                "slotSetting": false
              },
              {
                "name": "ORYX_BUILD_PLATFORM_VERSION",
                "value": "3.11",
                "slotSetting": false
              },
              {
                "name": "SCM_COMMAND_IDLE_TIMEOUT",
                "value": "600",
                "slotSetting": false
              },
              {
                "name": "PIP_EXTRA_INDEX_URL",
                "value": "https://download.pytorch.org/whl/cpu",
                "slotSetting": false
              },
              {
                "name": "WEBSITES_PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1",
                "slotSetting": false
              }
            ]

      - name: Remove conflicting package settings
        shell: bash
        run: |
          az webapp config appsettings delete \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --setting-names \
              WEBSITE_RUN_FROM_PACKAGE \
              WEBSITE_RUN_FROM_ZIP \
            --output none || true

      - name: Configure FastAPI startup command
        shell: bash
        run: |
          az webapp config set \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --startup-file "python -m gunicorn -k uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000 main:app --timeout 120"

      - name: Deploy source package with Oryx build
        shell: bash
        run: |
          echo "Deploying source package and executing Oryx remote build..."
          az webapp deploy \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --src-path "./deploy/${{ env.DEPLOY_ZIP }}" \
            --type zip \
            --clean true \
            --restart true \
            --timeout 1200

      - name: Inspect deployment status and Oryx logs
        shell: bash
        if: always()
        run: |
          echo "Deployment log summary:"
          az webapp log deployment show \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" || true

      - name: Verify live service health
        shell: bash
        run: |
          APP_HOSTNAME=$(az webapp show \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "defaultHostName" \
            --output tsv)

          HEALTH_URL="https://${APP_HOSTNAME}/health"
          echo "Verifying live service health at: ${HEALTH_URL}"

          MAX_ATTEMPTS=30
          DELAY=10
          SUCCESS=0

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Health probe attempt $i of $MAX_ATTEMPTS..."

            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 "${HEALTH_URL}" || echo -e "curl_error\n000")
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
            BODY=$(echo "$HTTP_RESPONSE" | head -n -1)

            echo "HTTP Status: ${HTTP_STATUS}"
            echo "Response Body: ${BODY}"

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Service is HEALTHY and returned HTTP 200!"
              SUCCESS=1
              break
            fi

            echo "Waiting for service to stabilize (status: ${HTTP_STATUS}). Retrying in ${DELAY}s..."
            sleep $DELAY
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Service health check failed after $((MAX_ATTEMPTS * DELAY)) seconds!"
            exit 1
          fi
