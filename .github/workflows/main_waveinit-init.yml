name: Build and deploy Python AI service to Azure Web App - waveinit-init

on:
  push:
    branches:
      - main
    paths:
      - "ai-service/**"
      - ".github/workflows/main_waveinit-init.yml"

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: waveinit-init
  PYTHON_VERSION: "3.11"
  SERVICE_PATH: ai-service
  DEPLOY_ZIP: ai-service-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate requirements
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify runtime packages
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python - <<'PY'
          import fastapi
          import uvicorn
          import gunicorn

          print("FastAPI OK:", fastapi.__version__)
          print("Uvicorn OK:", uvicorn.__version__)
          print("Gunicorn OK:", gunicorn.__version__)
          PY

      - name: Verify FastAPI application
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          python - <<'PY'
          from main import app

          print("FastAPI app import OK")
          print("App:", app)
          PY

      - name: Create Azure deployment package
        run: |
          git archive \
            --format=zip \
            --output="${DEPLOY_ZIP}" \
            HEAD:${SERVICE_PATH}

      - name: Verify deployment package
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          package = "ai-service-source.zip"

          with ZipFile(package) as archive:
              names = set(archive.namelist())

          required = {
              "requirements.txt",
              "main.py",
              ".deployment",
              # startup.sh installs the system GL/graphics libs (libgl1,
              # libglib2.0-0) required by OpenCV/MediaPipe and activates the
              # Oryx-built antenv. If it is missing the zip ships with no way to
              # bring CV engines up (health would report libGL.so.1 missing).
              "startup.sh",
              # CV engine models are REQUIRED at runtime. yolov8n.pt is the
              # git-tracked COCO weights (see .gitignore negation); the mediapipe
              # .task files are tracked too. If any of these go missing the
              # archive would silently ship a service whose health reports
              # yolo_engine/proctoring_engine unavailable.
              "models/yolov8n.pt",
              "models/face_landmarker.task",
              "models/pose_landmarker_lite.task",
          }

          missing = required - names

          if missing:
              raise RuntimeError(
                  f"Missing deployment files: {sorted(missing)}"
              )

          # Guard against 0-byte placeholders being committed in place of real
          # model weights. (yolov8n.pt ≈ 19 MB, the landmarker models ≈ 4-6 MB.)
          minimum_weights = {
              "models/yolov8n.pt": 5_000_000,
              "models/face_landmarker.task": 1_000_000,
              "models/pose_landmarker_lite.task": 1_000_000,
          }
          undersized = [
              name for name, minimum in minimum_weights.items()
              if archive.getinfo(name).file_size < minimum
          ]
          if undersized:
              raise RuntimeError(
                  f"Model files are unexpectedly small: {undersized}"
              )

          forbidden_roots = {
              "antenv",
              ".venv",
              "venv",
              "__pycache__",
          }

          invalid = [
              name for name in names
              if name.split("/")[0] in forbidden_roots
          ]

          if invalid:
              raise RuntimeError(
                  f"Deployment package contains local environment files: {invalid[:10]}"
              )

          print("Deployment package is valid.")
          print(f"Package contains {len(names)} files.")
          PY

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ env.DEPLOY_ZIP }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03AD2C5843F24006BFC1663DE7E2BD7A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2AAFDF1F53BE4ADB850460F3750C2437 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42B805BB56D5497BB27CAAF402A3C099 }}

      - name: Resolve Resource Group
        id: rg
        shell: bash
        run: |
          RG=$(az webapp list \
            --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" \
            --output tsv)

          if [ -z "$RG" ] || [ "$RG" = "None" ]; then
            RG="WAVEINIT_BD"
          fi

          echo "RESOURCE_GROUP=${RG}" >> $GITHUB_ENV
          echo "Resolved Resource Group: ${RG}"

      - name: Configure Azure App Settings for Oryx Build
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "ENABLE_ORYX_BUILD",
                "value": "true",
                "slotSetting": false
              },
              {
                "name": "ORYX_BUILD_PLATFORM",
                "value": "python",
                "slotSetting": false
              },
              {
                "name": "ORYX_BUILD_PLATFORM_VERSION",
                "value": "3.11",
                "slotSetting": false
              },
              {
                "name": "SCM_COMMAND_IDLE_TIMEOUT",
                "value": "600",
                "slotSetting": false
              },
              {
                "name": "PIP_EXTRA_INDEX_URL",
                "value": "https://download.pytorch.org/whl/cpu",
                "slotSetting": false
              },
              {
                "name": "WEBSITES_PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PORT",
                "value": "8000",
                "slotSetting": false
              },
              {
                "name": "PYTHONUNBUFFERED",
                "value": "1",
                "slotSetting": false
              }
            ]

      - name: Remove conflicting package settings
        shell: bash
        run: |
          az webapp config appsettings delete \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --setting-names \
              WEBSITE_RUN_FROM_PACKAGE \
              WEBSITE_RUN_FROM_ZIP \
            --output none || true

      - name: Configure FastAPI startup command
        shell: bash
        run: |
          # Run startup.sh (shipped in the deployment package), NOT a raw
          # gunicorn command. startup.sh installs the system graphics/GL libs
          # (libgl1, libglib2.0-0, libxcb1, libxext6) that OpenCV/MediaPipe
          # require at runtime — the Oryx-built image does not ship libGL.so.1,
          # and without it both CV engines fail to initialize and /health
          # reports proctoring/yolo engine "unavailable" with
          # "libGL.so.1: cannot open shared object file". It also activates the
          # Oryx-built antenv virtualenv and applies headless env vars.
          az webapp config set \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --startup-file "bash startup.sh"

      - name: Deploy source package with Oryx build (async)
        shell: bash
        run: |
          # Oryx remote build for the heavy ML requirements (torch, mediapipe,
          # transformers, faiss, sentence-transformers, ...) takes minutes and
          # blows past the SCM front-end's ~230s synchronous request window
          # (HTTP 504.0 GatewayTimeout). Deploy asynchronously: the zip is
          # pushed immediately, Oryx builds it in the background, and the
          # "Verify live service health" step below polls until the freshly
          # built app responds.
          #
          # az webapp deploy --async --timeout 1200 returns a NONZERO tracking
          # timeout once that window elapses EVEN IF the Oryx build is still
          # running server-side (the deployment keeps going; the CLI just stops
          # watching). That is not a deployment failure, so do not fail the step
          # on it: the health gate below is the real success/failure decision
          # and requires both engines to report "available".
          echo "Deploying source package asynchronously and executing Oryx remote build..."
          set +e
          az webapp deploy \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --src-path "./deploy/${{ env.DEPLOY_ZIP }}" \
            --type zip \
            --clean true \
            --restart true \
            --async true \
            --timeout 3600
          AZ_RC=$?
          set -e

          # Kills the step only if the deploy call itself actually errored
          # (e.g. auth or network), not if the tracker window elapsed while the
          # build is legitimately still progressing.
          if [ "${AZ_RC}" -gt 0 ]; then
            echo "⚠️  az webapp deploy returned exit ${AZ_RC}."

            # Distinguish "tracker window elapsed, build still running" from a
            # genuine failure. InProgress/failed-instance counts come through the
            # deployment status JSON via az webapp log deployment show, which the
            # next step prints.
            az webapp log deployment show \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" || true

            # A nonzero code is expected when the tracker window elapses during a
            # long Oryx build. Only a hard az CLI failure (missing rg/app,
            # auth) should abort here — anything else is handed to the health gate.
            if ! az webapp show --name "${AZURE_WEBAPP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" > /dev/null 2>&1; then
              echo "❌ Web App not found or unreachable — aborting."
              exit 1
            fi

            echo "Deployment is still in progress server-side; waiting on the health gate..."
          fi

      - name: Inspect deployment status and Oryx logs
        shell: bash
        if: always()
        run: |
          echo "Deployment log summary:"
          az webapp log deployment show \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" || true

      - name: Verify live service health
        shell: bash
        run: |
          APP_HOSTNAME=$(az webapp show \
            --name "${AZURE_WEBAPP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "defaultHostName" \
            --output tsv)

          HEALTH_URL="https://${APP_HOSTNAME}/health"
          echo "Verifying live service health at: ${HEALTH_URL}"

          # Async + Oryx remote build of these ML deps can run 20-40 minutes on
          # a cold build; poll up to 60 minutes. The tracker window (above) may
          # have already surfaced, so this gate is the definitive success check:
          # /health must report BOTH engines actually ready
          # ("yolo_engine":"available" and "proctoring_engine":"available"),
          # not merely contain the keys — matching the truthfulness requirement
          # (no "ready" claims while the engines are down). startup.sh installs
          # libGL etc., so with a clean build both engines must come up.
          MAX_ATTEMPTS=240
          DELAY=15
          SUCCESS=0

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Health probe attempt $i of $MAX_ATTEMPTS..."

            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 20 "${HEALTH_URL}" || echo -e "curl_error\n000")
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
            BODY=$(echo "$HTTP_RESPONSE" | head -n -1)

            echo "HTTP Status: ${HTTP_STATUS}"
            echo "Response Body: ${BODY}"

            if [ "$HTTP_STATUS" = "200" ] && \
               echo "$BODY" | grep -q '"yolo_engine":"available"' && \
               echo "$BODY" | grep -q '"proctoring_engine":"available"'; then
              echo "✅ Service is HEALTHY with YOLO and proctoring engines ready!"
              SUCCESS=1
              break
            fi

            echo "Build still in progress or engines not ready (status: ${HTTP_STATUS}). Retrying in ${DELAY}s..."
            sleep $DELAY
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Service health check failed (engines not ready) after $((MAX_ATTEMPTS * DELAY)) seconds!"
            echo "--- Deployment status (BUILDING vs SUCCESS vs FAILED) ---"
            az webapp log deployment show \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" || true
            echo "--- Help: tail the app/runtime logs ---"
            echo "az webapp log tail --name ${AZURE_WEBAPP_NAME} --resource-group ${RESOURCE_GROUP}"
            exit 1
          fi
